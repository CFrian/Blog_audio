<body>
    <header>


    </header>



    <section class="inscription">
        <form id="formSub">
            <h2>Inscription</h2>
            <hr>
            <h3>Pseudo</h3>
            <input type="text" name="nomUser" id="pseudo" placeholder="nom visible par les utilisateurs" required>
            <h3>Adresse mail</h3>
            <input type="email" name="mailUser" id="mail" placeholder="adresse mail valide" required>
            <h3>Mot de passe</h3>
            <input type="password" name="passUser" id="password" placeholder="ajouter un mot de passe" required>
            <h3>Vérification du mot de passe</h3>
            <input type="password" name="passUserConfirm" id="passwordComparatif"
                placeholder="confirmer le mot de passe" required>

            <button type="submit">Créer le compte</button>
    </section>
    </form>
